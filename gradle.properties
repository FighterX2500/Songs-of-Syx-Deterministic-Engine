# Trust the certificates Windows trusts. Antivirus HTTPS scanning (for example
# Avast Web Shield) re-signs downloads with a root that only Windows knows, and
# Java's own trust store then rejects Maven Central and the Gradle download.
# The project is Windows-only (AGENTS.md), so this holds on every build PC.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

org.gradle.caching=false
org.gradle.configuration-cache=false
